<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="calculator">
            <div class="calculator-display"></div>
            <div class="calculator-buttons">
                <button class="calculator-button" id="empty-button-1"></button>
                <button class="calculator-button" id="clear-button">CE</button>
                <button class="calculator-button" id="back-button">&#9003</button>
                <button class="calculator-button" id="buttonide-button">&#247</button>
                <button class="calculator-button" id="button-7">7</button>
                <button class="calculator-button" id="button-8">8</button>
                <button class="calculator-button" id="button-9">9</button>
                <button class="calculator-button" id="button-multiply">&#215</button>
                <button class="calculator-button" id="button-4">4</button>
                <button class="calculator-button" id="button-5">5</button>
                <button class="calculator-button" id="button-6">6</button>
                <button class="calculator-button" id="button-minus">&#8211</button>
                <button class="calculator-button" id="button-1">1</button>
                <button class="calculator-button" id="button-2">2</button>
                <button class="calculator-button" id="button-3">3</button>
                <button class="calculator-button" id="button-plus">&#43</button>
                <button class="calculator-button" id="button-empty-2"></button>
                <button class="calculator-button" id="button-0">0</button>
                <button class="calculator-button" id="button-decimal">.</button>
                <button class="calculator-button" id="button-equals">=</button>
            </div>
        </div>
    </div>
    <script src="javascript.js"></script>
</body>
</html>

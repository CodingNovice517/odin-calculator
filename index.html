<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="calculator">
            <div class="calculator-display">0</div>
            <div class="calculator-btns">
                <button class="calculator-btn" id="empty-btn-1"></button>
                <button class="calculator-btn" id="clear-btn">CE</button>
                <button class="calculator-btn" id="back-btn">&#9003</button>
                <button class="calculator-btn" id="buttonide-btn">&#247</button>
                <button class="calculator-btn" id="btn-7">7</button>
                <button class="calculator-btn" id="btn-8">8</button>
                <button class="calculator-btn" id="btn-9">9</button>
                <button class="calculator-btn" id="btn-multiply">&#215</button>
                <button class="calculator-btn" id="btn-4">4</button>
                <button class="calculator-btn" id="btn-5">5</button>
                <button class="calculator-btn" id="btn-6">6</button>
                <button class="calculator-btn" id="btn-minus">&#8211</button>
                <button class="calculator-btn" id="btn-1">1</button>
                <button class="calculator-btn" id="btn-2">2</button>
                <button class="calculator-btn" id="btn-3">3</button>
                <button class="calculator-btn" id="btn-plus">&#43</button>
                <button class="calculator-btn" id="btn-empty-2"></button>
                <button class="calculator-btn" id="btn-0">0</button>
                <button class="calculator-btn" id="btn-decimal">.</button>
                <button class="calculator-btn" id="btn-equals">=</button>
            </div>
        </div>
    </div>
    <script src="javascript.js"></script>
</body>
</html>

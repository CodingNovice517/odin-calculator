<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="calculator">
            <div class="calculator-display"></div>
            <div class="calculator-buttons">
                <div class="calculator-button" id="empty-button-1"></div>
                <div class="calculator-button" id="clear-button">CE</div>
                <div class="calculator-button" id="back-button">&#9003</div>
                <div class="calculator-button" id="divide-button">&#247</div>
                <div class="calculator-button" id="button-7">7</div>
                <div class="calculator-button" id="button-8">8</div>
                <div class="calculator-button" id="button-9">9</div>
                <div class="calculator-button" id="button-multiply">&#215</div>
                <div class="calculator-button" id="button-4">4</div>
                <div class="calculator-button" id="button-5">5</div>
                <div class="calculator-button" id="button-6">6</div>
                <div class="calculator-button" id="button-minus">&#8211</div>
                <div class="calculator-button" id="button-1">1</div>
                <div class="calculator-button" id="button-2">2</div>
                <div class="calculator-button" id="button-3">3</div>
                <div class="calculator-button" id="button-plus">&#43</div>
                <div class="calculator-button" id="button-empty-2"></div>
                <div class="calculator-button" id="button-0">0</div>
                <div class="calculator-button" id="button-decimal">.</div>
                <div class="calculator-button" id="button-equals">=</div>
            </div>
        </div>
    </div>
    <script src="javascript.js"></script>
</body>
</html>
